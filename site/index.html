<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>MOON · 策略业绩</title>
<style>
:root{color-scheme:light;--blue:#0066df;--ink:#285c8f;--line:#d9e7fc;--up:#eb0029;--down:#00852b}
*{box-sizing:border-box}html{scroll-behavior:auto;scroll-padding-top:calc(var(--toolbar-height, 96px) + 14px)}body{margin:0;background:linear-gradient(180deg,#edf5ff,#f8fbff 700px);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,a,input{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #79b2ff;outline-offset:3px}
.toolbar{position:sticky;top:0;z-index:3;background:#f8fbfff5;border-bottom:1px solid var(--line);backdrop-filter:blur(12px);padding:16px 24px}.topline,.controls{display:flex;align-items:center;gap:20px;flex-wrap:wrap}.topline{justify-content:flex-end;margin-bottom:14px}.status{font-size:14px;color:#6785a7}.controls{justify-content:space-between}.ranges,.strategies{display:flex;gap:6px;flex-wrap:wrap}.range,.strategies a{border:1px solid transparent;background:#fff;border-radius:9px;color:var(--ink);padding:9px 14px;text-decoration:none;font-size:14px}.range[aria-pressed=true]{background:#0066df;color:white}.strategies a{padding-left:14px;padding-right:14px;background:#fff;border-color:var(--blue);color:var(--blue)}.strategies a:hover{background:#fff}.strategies a[aria-current="location"]{background:var(--blue);color:#fff}
main{max-width:1920px;margin:auto;padding:22px 24px 40px}.strategy{margin-bottom:26px;background:#ffffffaa;border:1px solid #cfe1fc;border-radius:18px;padding:18px}.strategy:last-child{min-height:calc(100vh - var(--toolbar-height, 96px) - 14px)}.strategy-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 4px 12px}h2{font-size:20px;color:var(--blue);margin:0}.date{color:var(--blue);background:#e8f2ff;padding:7px 12px;border-radius:10px;font:600 14px Menlo,Consolas,monospace}
.chart{background:linear-gradient(180deg,#edf5ff,#f9fcff);border:1px solid var(--line);border-radius:15px;overflow:hidden;padding:16px 16px 4px}.metrics{display:flex;justify-content:flex-start;gap:12px;flex-wrap:nowrap;min-height:25px;font-size:14px;color:var(--blue)}.metrics>span{white-space:nowrap}.metrics strong{font:600 16px Menlo,Consolas,monospace;margin-left:7px}.chart svg{display:block;width:100%;height:360px}.up{color:var(--up)}.down{color:var(--down)}.number{font-family:Menlo,Consolas,"Liberation Mono",monospace;font-variant-numeric:tabular-nums}
.monthly,.trades{margin-top:12px;padding:12px;background:#fbfdff;border:1px solid var(--line);border-radius:14px}.table-wrap{overflow:auto;overscroll-behavior-x:none;scrollbar-width:thin}table{border-collapse:separate;border-spacing:3px;width:100%;font-size:13px;white-space:nowrap;text-align:center}th{font-weight:500;font-size:12px;color:#6781a5;padding:8px 10px}td{padding:7px 10px;border-radius:7px;background:#f0f6ff;font-family:Menlo,Consolas,"Liberation Mono",monospace;font-weight:600}td:first-child{color:var(--blue)}.monthly table{min-width:1050px;table-layout:fixed}.monthly th:first-child,.monthly td:first-child{position:sticky;left:0;background:#eff6ff;z-index:1}.trades h3{font-size:14px;font-weight:500;color:var(--ink);margin:0 0 9px 4px}.trades .table-wrap{max-height:270px}.trades table{min-width:790px;border-spacing:0}.trades th{position:sticky;top:0;background:#f0f6ff;z-index:1;padding:10px 14px}.trades td{font-weight:400;background:transparent;border-radius:0;border-bottom:1px solid #e9f0fb;padding:10px 14px}.trades td:first-child{color:var(--ink)}.empty{padding:70px 20px;text-align:center;font-size:14px;color:#7891ad}.notice{font-size:14px;line-height:1.7;padding:24px;text-align:center}.error{color:#a63d25}.loading{opacity:.65}
.chart svg.with-drawdown{height:510px}
.topline{flex-wrap:nowrap}.topline .status{flex:1;min-width:0;text-align:left}.contact-button{border:1px solid var(--blue);border-radius:9px;background:white;color:var(--blue);padding:7px 12px;font-size:14px;white-space:nowrap}.contact-button:hover{background:#e8f2ff}
.status-updated{white-space:nowrap}.status-countdown{display:inline-block;width:3ch;text-align:right;font-variant-numeric:tabular-nums}#contact-open{flex-shrink:0}
.refresh-status{position:fixed;right:calc(12px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));z-index:4;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:#f8fbfff5;color:#6785a7;font-size:12px;line-height:18px;white-space:nowrap;pointer-events:none}main{padding-bottom:64px}
#contact-open{visibility:hidden;opacity:0;pointer-events:none}#contact-open.scroll-visible{visibility:visible;opacity:1;pointer-events:auto}
.contact-dialog{width:360px;max-width:calc(100% - 32px);max-height:calc(100vh - 32px);padding:16px;border:1px solid var(--line);border-radius:18px;color:var(--ink);background:#fff;overflow:auto}.contact-dialog::backdrop{background:#19324d66}.contact-heading{display:flex;justify-content:flex-end;margin-bottom:8px}.contact-dialog img{display:block;width:100%;height:auto}
@media(min-width:1600px){.chart svg{height:430px}.chart svg.with-drawdown{height:612px}}
@media(max-width:700px){.toolbar{padding:14px 12px}.topline{gap:8px;margin-bottom:10px}.status{font-size:12px}.controls{gap:8px}.ranges{width:100%;justify-content:space-between;gap:2px}.range{padding:8px 3px;font-size:12px}.strategies a{padding:6px 10px}.strategy{padding:12px;margin-bottom:18px;border-radius:14px}main{padding:14px 10px 24px}.strategy-heading{margin-bottom:8px}h2{font-size:18px}.chart{padding:12px 4px 2px}.chart svg{height:250px}.metrics{display:grid;grid-template-columns:max-content max-content;padding:0 8px;gap:8px 12px;font-size:12px}.metrics strong{font-size:14px}.monthly,.trades{padding:7px}.monthly table{min-width:1000px}.trades .table-wrap{max-height:250px}.date{font-size:12px}.trade-date,.trade-time{display:block}}
@media(max-width:700px){.chart svg.with-drawdown{height:auto}}
@media(max-width:700px){.status{line-height:18px;min-height:18px}.status-updated{display:block;min-height:18px}main{padding-bottom:64px}}
</style>
</head>
<body>
<header class="toolbar">
 <div class="topline"><span class="status" id="status" role="status"><span class="status-updated">数据截至 —</span></span><button type="button" class="contact-button" id="contact-open" aria-haspopup="dialog" aria-controls="contact-dialog" aria-expanded="false">联系我</button></div>
 <div class="controls">
  <nav class="strategies" aria-label="策略"><a href="#all-pro" aria-current="location">全天候2.0</a><a href="#dzi">DZI</a><a href="#atlas">ATLAS</a></nav>
  <div class="ranges" role="group" aria-label="业绩时间范围">
   <button class="range" data-period="10y" aria-pressed="false">最近10年</button><button class="range" data-period="5y" aria-pressed="false">最近5年</button><button class="range" data-period="3y" aria-pressed="true">最近3年</button><button class="range" data-period="1y" aria-pressed="false">最近1年</button><button class="range" data-period="ytd" aria-pressed="false">今年</button><button class="range" data-period="since_launch" aria-pressed="false" title="按各策略上线日期起算，以上线前一条净值为基准，包含上线当日收益">上线后</button>
  </div>
 </div>
</header>
<dialog class="contact-dialog" id="contact-dialog" aria-label="微信联系二维码">
 <div class="contact-heading"><button type="button" class="contact-button" id="contact-close" autofocus>关闭</button></div>
 <img src="assets/wechat-contact.jpg" alt="王仁东的微信二维码，扫码添加好友" width="888" height="1140">
</dialog>
<main id="content" aria-busy="true"><div class="notice">正在加载净值曲线、月收益和最近成交…</div></main>
<div class="refresh-status" id="refresh-status" role="status">正在读取业绩…</div>

<script>
const content = document.getElementById('content'), status = document.getElementById('status'), refreshStatus = document.getElementById('refresh-status');
const toolbar = document.querySelector('.toolbar');
const contactDialog = document.getElementById('contact-dialog'), contactOpen = document.getElementById('contact-open');
contactOpen.addEventListener('click',()=>{contactDialog.showModal();contactOpen.setAttribute('aria-expanded','true');});
document.getElementById('contact-close').addEventListener('click',()=>contactDialog.close());
contactDialog.addEventListener('close',()=>contactOpen.setAttribute('aria-expanded','false'));
let contactScrollY=window.scrollY;
window.addEventListener('scroll',()=>{
 const current=window.scrollY;
 if(current===contactScrollY)return;
 contactScrollY=current;contactOpen.classList.add('scroll-visible');
},{passive:true});
function updateToolbarOffset() {
 document.documentElement.style.setProperty('--toolbar-height', `${toolbar.getBoundingClientRect().height}px`);
}
new ResizeObserver(updateToolbarOffset).observe(toolbar);
updateToolbarOffset();
let period = '3y', serial = 0, controller, snapshot = '', remaining = 180, updated = '', data = null;
const escape = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const date = value => value ? `${value.slice(0,4)}-${value.slice(4,6)}-${value.slice(6,8)}` : '—';
const number = (value, digits=2) => Number(value).toLocaleString('zh-CN',{minimumFractionDigits:digits,maximumFractionDigits:digits});
const color = value => value > 0 ? 'up' : value < 0 ? 'down' : '';
const percent = value => value == null || !Number.isFinite(Number(value)) ? '—' : `${value>0?'+':''}${Number(value).toFixed(2)}%`;
function chart(strategy) {
 const points = strategy.equity_curve;
 if (!points.length) return '<div class="empty">所选区间暂无净值数据</div>';
 const navs=points.map(p=>p.net_value), drawdowns=points.map(p=>p.drawdown), last=navs.at(-1);
 const drawdown=Math.min(0,...drawdowns);
 const ms = day => Date.UTC(+day.slice(0,4),+day.slice(4,6)-1,+day.slice(6,8));
 const days=(ms(points.at(-1).date)-ms(points[0].date))/86400000;
 const launchDays=period==='since_launch'?new Set(points.filter(p=>p.date>=strategy.launch_date).map(p=>p.date)).size:2;
 const annual=days>0&&launchDays>1?(Math.pow(last/navs[0],365.25/days)-1)*100:null;
 const width=innerWidth<=700?640:1600,height=innerWidth<=700?340:460,left=innerWidth<=700?88:70,right=24,top=25,bottom=45;
 const low=Math.min(...navs), high=Math.max(...navs), spread=Math.max(high-low,.002);
 const min=Math.max(0,low-spread*.13),max=high+spread*.13;
 const x=i=>left+(points.length===1?(width-left-right)/2:i*(width-left-right)/(points.length-1));
 let launchX=null;
 if(strategy.launch_date&&strategy.launch_date>=points[0].date&&strategy.launch_date<=points.at(-1).date){
  const index=points.findIndex(p=>p.date>=strategy.launch_date);
  launchX=x(index);
  if(index>0&&points[index].date!==strategy.launch_date){
   const ratio=(ms(strategy.launch_date)-ms(points[index-1].date))/(ms(points[index].date)-ms(points[index-1].date));
   launchX=x(index-1)+(x(index)-x(index-1))*ratio;
  }
 }
 const y=v=>top+(max-v)*(height-top-bottom)/(max-min);
 const line=navs.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(2)},${y(v).toFixed(2)}`).join(' ');
 const lastX=x(points.length-1),lastY=y(last),baseline=height-bottom;
 const labels=[max,1,min].filter((v,i,a)=>v>=min&&v<=max&&a.indexOf(v)===i).map(v=>`<text x="${left-10}" y="${y(v)+5}" text-anchor="end">${v.toFixed(4)}</text>`).join('');
 const font=innerWidth<=700?16:13;
 const ddHeight=innerWidth<=700?200:190,ddTop=18,ddGap=4;
 const ddMin=Math.min(-.1,...drawdowns)*1.12;
 const ddY=v=>ddTop+v/ddMin*(ddHeight-ddTop-bottom);
 const ddLine=drawdowns.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(2)},${ddY(v).toFixed(2)}`).join(' ');
 const ddGrid=[0,ddMin/2,ddMin].map(v=>`<line x1="${left}" x2="${width-right}" y1="${ddY(v)}" y2="${ddY(v)}" stroke="#d9e7fc"/><text x="${left-10}" y="${ddY(v)+5}" text-anchor="end">${percent(v*100)}</text>`).join('');
 return `<div class="metrics"><span>净值<strong class="${color(last-1)}">${last.toFixed(4)}</strong></span><span>年化收益<strong class="${color(annual)}">${percent(annual)}</strong></span><span>夏普<strong>${strategy.risk_metrics?.sharpe==null?'—':number(strategy.risk_metrics.sharpe)}</strong></span><span>最大回撤<strong class="down">${percent(drawdown*100)}</strong></span></div>
 <svg class="with-drawdown" viewBox="0 0 ${width} ${height+ddGap+ddHeight}" role="img" aria-label="${escape(strategy.title)}净值曲线及区间回撤副图，${date(points[0].date)}至${date(points.at(-1).date)}" style="font:${font}px Menlo,Consolas,monospace;fill:#537ba8">
 <defs><linearGradient id="fill-${strategy.view}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#abc4ed" stop-opacity=".55"/><stop offset="1" stop-color="#eaf2ff" stop-opacity=".15"/></linearGradient></defs>
 ${1>=min&&1<=max?`<line x1="${left}" x2="${width-right}" y1="${y(1)}" y2="${y(1)}" stroke="#9ba9bb" stroke-dasharray="5 5"/>`:''}
 <path d="${line} L${lastX},${baseline} L${x(0)},${baseline} Z" fill="url(#fill-${strategy.view})"/>
 <path d="${line}" fill="none" stroke="#0066df" stroke-width="2.6" stroke-linejoin="round"/>
 <circle cx="${lastX}" cy="${lastY}" r="4.5" fill="#0066df" stroke="white" stroke-width="2"/>
 ${launchX==null?'':`<line class="launch-marker" x1="${launchX}" x2="${launchX}" y1="${top}" y2="${height-bottom}" stroke="#eb0029" stroke-width="1.5" stroke-dasharray="6 5" aria-label="上线分界线"/>`}
 ${labels}<text x="${left}" y="${height-12}">${date(points[0].date)}</text><text x="${width-right}" y="${height-12}" text-anchor="end">${date(points.at(-1).date)}</text>
 <g class="drawdown-panel" transform="translate(0 ${height+ddGap})" role="group" aria-label="相对所选区间内此前最高净值的回撤">
 <title>当前净值 ÷ 所选区间内截至当前的最高净值 − 1；曲线最低点与顶部最大回撤一致</title>
 <text x="${left}" y="${ddTop-4}">区间回撤</text>
 ${ddGrid}
 ${launchX==null?'':`<line class="launch-marker" x1="${launchX}" x2="${launchX}" y1="${ddTop}" y2="${ddHeight-bottom}" stroke="#eb0029" stroke-width="1.5" stroke-dasharray="6 5" aria-label="上线分界线"/>`}
 <path d="${ddLine} L${lastX},${ddY(0)} L${x(0)},${ddY(0)} Z" fill="#00852b" fill-opacity=".10"/>
 <line class="drawdown-threshold" x1="${left}" x2="${width-right}" y1="${ddY(-.1)}" y2="${ddY(-.1)}" stroke="#eb0029" stroke-width="1.5" stroke-dasharray="6 5" aria-label="最大回撤10%参考线"/>
 <text x="${width-right-4}" y="${ddY(-.1)-6}" text-anchor="end" fill="#eb0029">-10%</text>
 <path d="${ddLine}" fill="none" stroke="#00852b" stroke-width="2" stroke-linejoin="round"/>
 <circle cx="${lastX}" cy="${ddY(drawdowns.at(-1))}" r="3.5" fill="#00852b" stroke="white" stroke-width="1.5"/>
 <text x="${left}" y="${ddHeight-12}">${date(points[0].date)}</text><text x="${width-right}" y="${ddHeight-12}" text-anchor="end">${date(points.at(-1).date)}</text>
 </g>
 </svg>`;
}
function monthly(strategy) {
 const months=new Map(strategy.monthly_returns.map(m=>[`${m.year}-${m.month}`,m]));
 const years=[...new Set(strategy.monthly_returns.map(m=>m.year))].sort();
 const cell=item=>`<td class="${color(item?.return_pct)}" title="${item?'截至 '+date(item.end_date):'暂无数据'}">${percent(item?.return_pct)}</td>`;
 return `<div class="monthly"><div class="table-wrap" id="months-${strategy.view}"><table aria-label="${escape(strategy.title)}月收益"><thead><tr><th>年份</th>${Array.from({length:12},(_,i)=>`<th>${i+1}月</th>`).join('')}<th>总收益</th></tr></thead><tbody>${years.length?years.map(year=>`<tr><td>${year}</td>${Array.from({length:12},(_,i)=>cell(months.get(`${year}-${i+1}`))).join('')}${cell(strategy.annual_returns.find(a=>a.year===year))}</tr>`).join(''):'<tr><td colspan="14">暂无月收益数据</td></tr>'}</tbody></table></div></div>`;
}
function trades(strategy) {
 if(strategy.view==='all-pro'||strategy.view==='dzi')return '';
 const rows=strategy.recent_trades;
 return `<div class="trades"><h3>最近成交</h3><div class="table-wrap" id="trades-${strategy.view}"><table aria-label="${escape(strategy.title)}最近成交"><thead><tr><th>时间</th><th>合约</th><th>买卖</th><th>开平</th><th>成交均价</th><th>手数</th><th title="沿用原页面匹配结果，单位元，未扣手续费">平仓盈亏</th></tr></thead><tbody>${rows.length?rows.map(t=>`<tr><td title="${escape(t.ts)}"><span class="trade-date">${escape(t.ts.slice(0,10))}</span><span class="trade-time"> ${escape(t.ts.slice(11,19))}</span></td><td>${escape(t.symbol)}</td><td>${escape({BUY:'买入',SELL:'卖出'}[t.direction]||t.direction)}</td><td>${escape({OPEN:'开仓',CLOSE:'平仓',CLOSETODAY:'平今'}[t.offset]||t.offset)}</td><td>${t.trade_price==null?'—':number(t.trade_price,4)}</td><td>${number(t.traded,0)}</td><td class="${color(t.close_pnl)}">${t.offset==='OPEN'?'—':t.close_pnl==null?'待核对':(t.close_pnl>0?'+':'')+number(t.close_pnl)}</td></tr>`).join(''):'<tr><td colspan="7">暂无成交记录</td></tr>'}</tbody></table></div></div>`;
}
function render(payload) {
 const scrollTop=window.scrollY, initialRender=!content.querySelector('.strategy');
 const positions=new Map([...document.querySelectorAll('.table-wrap')].map(e=>[e.id,[e.scrollLeft,e.scrollTop]]));
 const strategies=payload.strategies.filter(s=>['all-pro','dzi','atlas'].includes(s.view));
 content.innerHTML=strategies.map(s=>`<section class="strategy" id="${s.view}"><div class="strategy-heading"><h2>${escape(s.title)}</h2><span class="date" title="截至 ${date(s.end_date)}">${date(s.end_date)}</span></div><div class="chart">${chart(s)}</div>${monthly(s)}${trades(s)}</section>`).join('');
 for (const [id,[left,top]] of positions){const e=document.getElementById(id);if(e){e.scrollLeft=left;e.scrollTop=top;}}
 if(initialRender && location.hash) {
  const anchor = document.querySelector('.strategies a[aria-current="location"]');
  document.getElementById(anchor.hash.slice(1))?.scrollIntoView({behavior:'instant',block:'start'});
 } else if(!initialRender)window.scrollTo({top:scrollTop,behavior:'instant'});
}
function showPeriod() {
 if(!data)return;
 const payload=data.periods[period];
 if(!payload){content.innerHTML='<div class="notice">该区间数据正在更新，请稍后刷新。</div>';return;}
 const next=JSON.stringify(payload.strategies);
 if(next!==snapshot){render(payload);snapshot=next;}
}
function updateStatus(message='') {
 status.innerHTML=`<span class="status-updated">数据截至 ${updated?escape(updated):'—'}</span>`;
 refreshStatus.innerHTML=message||`<span class="status-countdown">${remaining}</span> 秒后检查更新`;
}
async function refresh() {
 if(controller)controller.abort();
 controller=new AbortController();const request=++serial;
 content.setAttribute('aria-busy','true');updateStatus('正在读取最新数据…');
 try {
  const url=new URL('data/moon.json',document.baseURI);
  url.searchParams.set('v',Math.floor(Date.now()/60000));
  const response=await fetch(url,{signal:controller.signal,cache:'no-store',credentials:'omit'});
  if(request!==serial)return;
  if(!response.ok)throw new Error(`HTTP ${response.status}`);
  const nextData=await response.json();if(request!==serial)return;
  if(nextData.schema_version!==1||!nextData.periods?.[period]?.strategies?.length)throw new Error('数据格式不正确');
  data=nextData;showPeriod();
  updated=data.generated_at.slice(0,19).replace('T',' ');remaining=180;updateStatus();
 } catch(error) {
  if(request===serial&&error.name!=='AbortError'){
   remaining=180;updateStatus(`${updated?'检查更新失败':'读取失败'}，<span class="status-countdown">180</span> 秒后重试`);
   if(!snapshot)content.innerHTML='<div class="notice error">暂时无法读取业绩，请稍后重试。</div>';
  }
 } finally{if(request===serial){content.setAttribute('aria-busy','false');controller=null;}}
}
function updateStrategyTabs() {
 const selected = ['#all-pro','#dzi','#atlas'].includes(location.hash) ? location.hash : '#all-pro';
 document.querySelectorAll('.strategies a').forEach(link => {
  if(link.getAttribute('href')===selected)link.setAttribute('aria-current','location');
  else link.removeAttribute('aria-current');
 });
}
window.addEventListener('hashchange',updateStrategyTabs);
updateStrategyTabs();
document.querySelector('.ranges').addEventListener('click',event=>{const button=event.target.closest('[data-period]');if(!button||button.dataset.period===period)return;period=button.dataset.period;snapshot='';document.querySelectorAll('[data-period]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));if(data)showPeriod();else refresh();});
setInterval(()=>{if(document.hidden||controller)return;remaining--;if(remaining<=0)refresh();else if(updated)updateStatus();},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
let resizeTimer, viewportWidth=innerWidth;
window.addEventListener('resize',()=>{
 if(innerWidth===viewportWidth)return;
 viewportWidth=innerWidth;clearTimeout(resizeTimer);
 resizeTimer=setTimeout(()=>{snapshot='';showPeriod();},200);
});
refresh();
</script>
</body>
</html>
